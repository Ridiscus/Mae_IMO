name: maelys_imo
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter_localizations:
    sdk: flutter
  dio: ^5.8.0+1
  encrypt: ^5.0.3
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  get_it: ^8.0.3
  go_router: ^16.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hydrated_bloc: ^10.0.0
  toastification: ^3.0.3
  flutter_svg: ^2.2.0
  pinput: ^5.0.1
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  intl: ^0.19.0
  google_fonts: ^6.2.1
  modal_bottom_sheet: ^3.0.0
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  change_app_package_name: ^1.5.0
  pretty_dio_logger: ^1.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/fonts/sourceSansPro/
    - assets/

  fonts:
  # Source Sans Pro
    - family: SourceSansPro-Black
      fonts:
        - asset: assets/fonts/sourceSansPro/SourceSansPro-Black.ttf
        - asset: assets/fonts/sourceSansPro/SourceSansPro-BlackItalic.ttf
          style: italic
    - family: SourceSansPro-Bold
      fonts:
        - asset: assets/fonts/sourceSansPro/SourceSansPro-Bold.ttf
        - asset: assets/fonts/sourceSansPro/SourceSansPro-BoldItalic.ttf
          style: italic
    - family: SourceSansPro-ExtraLight
      fonts:
        - asset: assets/fonts/sourceSansPro/SourceSansPro-ExtraLight.ttf
        - asset: assets/fonts/sourceSansPro/SourceSansPro-ExtraLightItalic.ttf
          style: italic
    - family: SourceSansPro-Light
      fonts:
        - asset: assets/fonts/sourceSansPro/SourceSansPro-Light.ttf
        - asset: assets/fonts/sourceSansPro/SourceSansPro-LightItalic.ttf
          style: italic
    - family: SourceSansPro-Regular
      fonts:
        - asset: assets/fonts/sourceSansPro/SourceSansPro-Regular.ttf
        - asset: assets/fonts/sourceSansPro/SourceSansPro-Italic.ttf
          style: italic
    - family: SourceSansPro-SemiBold
      fonts:
        - asset: assets/fonts/sourceSansPro/SourceSansPro-Semibold.ttf
        - asset: assets/fonts/sourceSansPro/SourceSansPro-SemiboldItalic.ttf
          style: italic
